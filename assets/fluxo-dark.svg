<svg xmlns="http://www.w3.org/2000/svg" width="380" height="336" viewBox="0 0 380 336" role="img" aria-label="Fluxo de trabalho: 1 especificação, 2 plano em fases, 3 campanha autônoma com agentes, 4 auditoria independente feita por outro modelo, que pode devolver correções até 3 vezes, e 5 produção só com aprovação humana."><title>Fluxo de trabalho: 1 especificação, 2 plano em fases, 3 campanha autônoma com agentes, 4 auditoria independente feita por outro modelo, que pode devolver correções até 3 vezes, e 5 produção só com aprovação humana.</title><style>.pulse{animation:pulse 6s linear infinite}@keyframes pulse{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}}</style><rect x=".5" y=".5" width="379" height="335" rx="12" fill="#0f161c" stroke="#24323c"/><line x1="36" y1="34" x2="36" y2="282" stroke="#24323c" stroke-width="1.5"/><path class="pulse" d="M36 34 V282" pathLength="100" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 94"/><circle cx="36" cy="34" r="13" fill="#0f161c" stroke="#2dd4bf" stroke-width="1.6"/><text x="36" y="38" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#2dd4bf" text-anchor="middle">1</text><text x="62" y="33" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" fill="#e7eef2">Especificação</text><text x="62" y="51" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#93a4b0">PRD, regras e arquitetura</text><circle cx="36" cy="96" r="13" fill="#0f161c" stroke="#2dd4bf" stroke-width="1.6"/><text x="36" y="100" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#2dd4bf" text-anchor="middle">2</text><text x="62" y="95" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" fill="#e7eef2">Plano em fases</text><text x="62" y="113" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#93a4b0">escopo e critério de aceite</text><circle cx="36" cy="158" r="13" fill="#0f161c" stroke="#2dd4bf" stroke-width="1.6"/><text x="36" y="162" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#2dd4bf" text-anchor="middle">3</text><text x="62" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" fill="#e7eef2">Campanha autônoma</text><text x="62" y="175" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#93a4b0">agentes implementam e testam</text><circle cx="36" cy="220" r="13" fill="#0f161c" stroke="#f2b33d" stroke-width="1.6"/><text x="36" y="224" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#f2b33d" text-anchor="middle">4</text><text x="62" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" fill="#e7eef2">Auditoria independente</text><text x="62" y="237" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#93a4b0">outro modelo, só leitura</text><circle cx="36" cy="282" r="13" fill="#0f161c" stroke="#2dd4bf" stroke-width="1.6"/><text x="36" y="286" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#2dd4bf" text-anchor="middle">5</text><text x="62" y="281" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" fill="#e7eef2">Produção</text><text x="62" y="299" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#93a4b0">só com aprovação humana</text><path d="M334 220 C 368 220, 368 158, 338 158" fill="none" stroke="#f2b33d" stroke-width="1.4" stroke-dasharray="4 4"/><path d="M344 154 l-6 4 6 4" fill="none" stroke="#f2b33d" stroke-width="1.4"/><text x="326" y="190" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#f2b33d" text-anchor="end" letter-spacing="1">FIX</text><text x="326" y="203" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" fill="#f2b33d" text-anchor="end">até 3×</text></svg>
